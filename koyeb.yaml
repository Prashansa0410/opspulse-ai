name: opspulse-api
type: web
env:
  ENVIRONMENT: production
  DATA_VOLUME: small
  PORT: 8000
regions:
  - fra
instance_type: nano
build:
  type: buildpack
  build_command: "pip install -r backend/requirements.txt && python -m backend.app.db.seed_data small"
  run_command: "uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
ports:
  - port: 8000
    path: /
routes:
  - path: /
    port: 8000
