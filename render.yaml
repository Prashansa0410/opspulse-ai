services:
  - type: web
    name: opspulse-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python -m backend.app.db.seed_data small"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATA_VOLUME
        value: small
      - key: RANDOM_SEED
        value: "42"
      - key: PYTHON_VERSION
        value: "3.12.8"
